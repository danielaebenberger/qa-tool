name: QA Harness

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Scope: run whenever test files or the harness itself changes.
    # Remove the paths filter if you want every PR analysed.
    paths:
      - 'tests/**'
      - 'src/**'
      - '.github/workflows/qa-harness.yml'

permissions:
  contents: read
  pull-requests: write   # needed to post the PR comment

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Computational sensors (Pillars A & B)
  # These run without any AI tokens; pure static analysis of the test suite.
  # ─────────────────────────────────────────────────────────────────────────────
  sensors:
    name: QA Sensors (Pillars A + B)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for git-diff in doc-reviewer

      # ── 2. Node.js (sensors are zero-dependency, needs ≥ 18) ──────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Copy sensors from QA-Harness repo if running standalone ─────────
      #   When this harness lives in its own repo (not embedded in the target
      #   repo), the sensors must be available.  If the harness is a submodule
      #   or copied into the target, this step is a no-op (files already exist).
      - name: Ensure sensor scripts are present
        run: |
          SENSOR_DIR="harness/sensors"
          if [ ! -d "$SENSOR_DIR" ]; then
            echo "⚠️  Sensor directory not found at $SENSOR_DIR — skipping sensor run."
            echo "SENSORS_AVAILABLE=false" >> "$GITHUB_ENV"
          else
            echo "SENSORS_AVAILABLE=true" >> "$GITHUB_ENV"
          fi

      # ── 4. AC Validator — Pillar A (computational part) ───────────────────
      - name: Run AC Validator
        if: env.SENSORS_AVAILABLE == 'true'
        id: ac_validator
        run: |
          node harness/sensors/ac-validator/ac-validator.js \
            --tests-dir tests/cypress/e2e \
            --output /tmp/ac-inventory.json \
            --verbose 2>&1 | tee /tmp/ac-validator.log || true
          echo "AC_LOG_OK=true" >> "$GITHUB_ENV"

      # ── 5. Cypress Analyzer — Pillar B ─────────────────────────────────────
      #   Exit code 1 → .only detected → CI hard-fails (intentional)
      - name: Run Cypress Analyzer
        if: env.SENSORS_AVAILABLE == 'true'
        id: cypress_analyzer
        run: |
          node harness/sensors/cypress-analyzer/cypress-analyzer.js \
            --tests-dir tests/cypress/e2e \
            --output /tmp/cypress-adequacy-report.json \
            --verbose 2>&1 | tee /tmp/cypress-analyzer.log
          echo "CYPRESS_EXIT=$?" >> "$GITHUB_ENV"
        # Exit code 1 = .only found — let the comment step explain this clearly,
        # then the job fails so the PR is blocked.

      # ── 6. Collect outputs for the comment ────────────────────────────────
      - name: Collect sensor outputs
        if: always() && env.SENSORS_AVAILABLE == 'true'
        id: collect
        run: |
          # Safely extract key fields from JSON; fall back to "N/A" on error
          AC_COUNT=$(node -e "
            try {
              const r = require('/tmp/ac-inventory.json');
              console.log(r.summary?.totalTests ?? 'N/A');
            } catch(e) { console.log('N/A'); }
          " 2>/dev/null || echo "N/A")

          CY_SCORE=$(node -e "
            try {
              const r = require('/tmp/cypress-adequacy-report.json');
              console.log(r.summary?.qualityScore ?? 'N/A');
            } catch(e) { console.log('N/A'); }
          " 2>/dev/null || echo "N/A")

          CY_GRADE=$(node -e "
            try {
              const r = require('/tmp/cypress-adequacy-report.json');
              console.log(r.summary?.grade ?? 'N/A');
            } catch(e) { console.log('N/A'); }
          " 2>/dev/null || echo "N/A")

          CY_SMELLS=$(node -e "
            try {
              const r = require('/tmp/cypress-adequacy-report.json');
              const smells = r.findings?.filter(f => f.severity === 'HIGH') ?? [];
              if (smells.length === 0) { console.log('None'); return; }
              smells.forEach(s => console.log('- \`' + s.type + '\` in ' + s.file));
            } catch(e) { console.log('N/A'); }
          " 2>/dev/null || echo "N/A")

          HAS_ONLY=$(node -e "
            try {
              const r = require('/tmp/cypress-adequacy-report.json');
              const found = r.findings?.some(f => f.type === 'HAS_ONLY') ?? false;
              console.log(found ? 'true' : 'false');
            } catch(e) { console.log('false'); }
          " 2>/dev/null || echo "false")

          # Write to GITHUB_OUTPUT (multiline safe)
          {
            echo "ac_count=$AC_COUNT"
            echo "cy_score=$CY_SCORE"
            echo "cy_grade=$CY_GRADE"
            echo "has_only=$HAS_ONLY"
            echo "cy_smells<<EOF"
            echo "$CY_SMELLS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ── 7. Post PR comment ─────────────────────────────────────────────────
      - name: Post QA Harness report comment
        if: always() && env.SENSORS_AVAILABLE == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const hasOnly  = '${{ steps.collect.outputs.has_only }}' === 'true';
            const cyScore  = '${{ steps.collect.outputs.cy_score }}';
            const cyGrade  = '${{ steps.collect.outputs.cy_grade }}';
            const acCount  = '${{ steps.collect.outputs.ac_count }}';
            const cySmells = `${{ steps.collect.outputs.cy_smells }}`;

            // Status badge
            let statusLine;
            if (hasOnly) {
              statusLine = '## 🔴 QA Harness — BLOCKED\n> **`.only` detected in Cypress tests — PR cannot be merged until removed.**';
            } else if (cyGrade === 'GOOD') {
              statusLine = '## 🟢 QA Harness — Sensors PASSED';
            } else if (cyGrade === 'FAIR') {
              statusLine = '## 🟡 QA Harness — Sensors FAIR (review gaps)';
            } else {
              statusLine = '## 🔴 QA Harness — Sensors POOR (action required)';
            }

            const body = `${statusLine}

            <!-- qa-harness-report -->
            *Automated sensor run — Pillars A & B (computational). AI-powered pillars require a human to invoke the skills below.*

            ---

            ### 📋 Pillar A — AC Inventory

            | Metric | Value |
            |--------|-------|
            | Test cases discovered | \`${acCount}\` |

            > **Action:** Run \`/qa-ac-validate\` in Copilot chat (VALIDATION mode) to map test cases to ACs and get PASS/PARTIAL/MISSING verdicts.

            ---

            ### 🧪 Pillar B — Test Adequacy

            | Metric | Value |
            |--------|-------|
            | Quality score | \`${cyScore}/100\` |
            | Grade | \`${cyGrade}\` |
            | \`.only\` detected | \`${hasOnly ? '⛔ YES — CI BLOCKED' : '✅ No'}\` |

            ${cySmells !== 'None' && cySmells !== 'N/A' ? `**HIGH severity smells:**\n${cySmells}` : '*No HIGH severity smells found.*'}

            > **Action:** Run \`/qa-cypress-analyze\` in Copilot chat for full gap analysis and recommendations.

            ---

            ### 👤 Pillar C — Persona UAT

            > **Action (manual):** Run \`/qa-persona-uat\` in Copilot chat. Requires human review at Stage 3 checkpoint before execution.

            ---

            ### 📖 Pillar D — Documentation Review

            > **Action (manual):** Fill in \`harness/guides/doc-standards/DOC_SOURCES_TEMPLATE.md\`, then run \`/qa-doc-review\` in Copilot chat.

            ---

            ### 🚀 Run Full Pipeline

            To run all six stages end-to-end:
            \`\`\`
            /qa-run --mode full
            \`\`\`
            Or target specific pillars:
            \`\`\`
            /qa-run --pillars A,B --mode validation
            \`\`\`

            ---
            <sub>QA Harness v1 · Sensors: \`ac-validator\` + \`cypress-analyzer\` · Node.js ≥ 18 · <a href="https://github.com/Jahia/jahia-qa/blob/main/QA-Harness/README.md">Harness README</a></sub>
            `;

            // Find existing comment to update (avoid duplicate comments on re-push)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('<!-- qa-harness-report -->')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

            // Hard-fail the job if .only was detected
            if (hasOnly) {
              core.setFailed('❌ .only detected in Cypress tests — remove before merging.');
            }
